<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Management sign-in · JalaSetu</title><style>
*{box-sizing:border-box}body{margin:0;min-height:100vh;background:radial-gradient(ellipse at 80% 0%,#d6effc,transparent 65%),#f1f6fb;color:#193d56;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;display:grid;place-items:center;padding:24px}.card{width:min(100%,450px);padding:38px;border:1px solid #d7e4ee;border-radius:22px;background:#fff;box-shadow:0 18px 65px #173f5b0d}.brand{font-size:29px;font-weight:800;letter-spacing:-1px}.eyebrow{margin-top:8px;font-size:10px;font-weight:700;letter-spacing:2px;color:#387ba4}h1{font-size:27px;line-height:1.2;margin:32px 0 12px;letter-spacing:-.7px}p{font-size:14px;line-height:1.7;color:#61778a}label{display:block;font-size:13px;font-weight:650;margin:20px 0 8px}input{width:100%;padding:13px;border:1px solid #cedce6;border-radius:10px;font:inherit;color:#183e58}input:focus{outline:3px solid #96d3f366;border-color:#2489c5}button{width:100%;margin-top:25px;padding:14px;border:0;border-radius:10px;background:linear-gradient(120deg,#2588dd,#285ac7);color:white;font:600 14px system-ui;cursor:pointer}button:disabled{opacity:.6;cursor:wait}.note{margin-top:26px;padding-top:20px;border-top:1px solid #e6edf3;font-size:12px}.error{color:#a82c3c;background:#fff0f2;border-radius:8px;padding:12px;font-size:13px;margin-top:18px}.error:empty{display:none}
</style></head><body><main class="card"><div class="brand">◒ JalaSetu</div><div class="eyebrow">WATER OPERATIONS · MANAGEMENT WORKSPACE</div><h1>Sign in to your workspace.</h1><p>Review evidence, coordinate water and power, and track decisions in one place.</p><form id="signin"><label for="username">Username</label><input id="username" name="username" autocomplete="username" value="management" required maxlength="150"><label for="password">Password</label><input id="password" name="password" type="password" autocomplete="current-password" required maxlength="512"><div id="error" class="error" role="alert"></div><button id="submit" type="submit">Sign in →</button></form><p class="note">Use the management credential configured for this deployment. After sign-in, open Connections to use your own temporary provider API keys.</p></main><script>
const form=document.getElementById('signin'),button=document.getElementById('submit'),error=document.getElementById('error');form.addEventListener('submit',async e=>{e.preventDefault();button.disabled=true;error.textContent='';try{const r=await fetch('/auth/login',{method:'POST',headers:{'Content-Type':'application/json'},credentials:'same-origin',body:JSON.stringify({username:form.username.value,password:form.password.value})});const data=await r.json();if(!r.ok)throw Error(data.detail||'Sign-in failed.');form.password.value='';location.assign('/')}catch(e){error.textContent=e.message;button.disabled=false}});
</script></body></html>

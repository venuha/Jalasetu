# Free sandbox: saved cloud records are temporary and may reset on restart/redeploy.
services:
  - type: web
    name: jalasetu
    runtime: python
    plan: free
    repo: https://github.com/venuha/Jalasetu
    branch: main
    buildCommand: pip install -r requirements.txt
    startCommand: python -m uvicorn app.main:app --host 0.0.0.0 --port $PORT --workers 1
    healthCheckPath: /api/health
    autoDeployTrigger: 'off'
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.12
      - key: WEB_CONCURRENCY
        value: '1'
      - key: JALASETU_DEPLOYED
        value: 'true'
      - key: JALASETU_DB
        value: /tmp/jalasetu/jalasetu.sqlite3
      - key: JALASETU_STORAGE_MODE
        value: ephemeral
      - key: JALASETU_ACCESS_USER
        value: management
      - key: JALASETU_ACCESS_PASSWORD
        generateValue: true
